name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock

      - name: Compile check
        run: python -m compileall vep/ scripts/evaluation/ scripts/reporting/ scripts/converters/

      - name: Verify manifest
        run: python scripts/verify_manifest.py

      - name: Run tests
        run: python -m pytest

      - name: Replay committed archive (no analyzers or databases)
        run: python scripts/evaluation/reproduce_archived_results.py --out-dir "$RUNNER_TEMP/replay" --plots

      - uses: actions/upload-artifact@v4
        with:
          name: archive-replay-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/replay
